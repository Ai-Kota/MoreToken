# MoreToken 容器编排 —— **generic 形态**（对外默认，T-029）。
#
# 适用：密钥用 env:VAR 引用（推荐）或字面量写在 config 里的部署——**无 vault、
# 无宿主 Go 工具链依赖**。key 经 `.env.keys`（gitignored）由 env_file 注入容器环境，
# 容器启动时 ResolveKeys 自行解析 env: 指针（复用既有已测试代码路径，零新增机制）。
#
# 三步跑起来（详见 docker/README.md）：
#   1. cp config/config.example.json config/config.json 并填入你的 base_url/模型/env:VAR 名
#   2. cp docker/.env.keys.example docker/.env.keys 并填入真实 key
#   3. bash docker/mt-up.sh
#
# vault 密码墙用户（密钥全在墙里、要求明文零落盘）：用 docker-compose.vault.yml + mt-deploy.sh。
#
# 参数化（多实例/旁路测试）：MT_CONTAINER / MT_PORT / MT_CONFIG 均可经环境变量覆盖。

name: moretoken

services:
  moretoken:
    container_name: ${MT_CONTAINER:-moretoken}
    build:
      context: ..                    # 仓库根（Dockerfile 的 COPY . . 需要 main.go/internal/go.mod）
      dockerfile: docker/Dockerfile
    image: moretoken:latest
    restart: always
    read_only: true                  # rootfs 只读；唯一可写点是 tmpfs /tmp
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${MT_PORT:-8462}:8462"   # 只绑回环；要开 LAN 先读 README 安全节
    volumes:
      # config：单文件 ro bind。安全依据：config **只在启动时读一次**、无热加载，
      # 不存在 tokens.json 那种"运行中被 rename 重写"的 inode 钉死问题（T-026 评审 S1
      # 只影响热加载文件）。文件里只有 env:VAR 指针/字面量——env: 形态下磁盘无明文。
      - ${MT_CONFIG:-../config/config.json}:/run/moretoken/config.json:ro
      # tokens.json（仅 SHA-256 哈希，无明文）——**目录** ro 挂载（吊销热加载要 rename 可见）。
      # 发放/吊销经 mt-token.sh（one-shot 容器 rw 挂载同目录写入）。
      - ./runtime:/run/mt-tokens:ro
    env_file:
      # 真实 key 放这里（EXAMPLE: MY_KEY=sk-xxx）。文件缺失不报错——
      # 字面量 key 用户本来就不需要它；env: 用户缺了它启动日志会响亮 WARN unresolved。
      - path: .env.keys
        required: false
    environment:
      # NATS 可选（增强非依赖，缺失即 no-op）：有 NATS 服务器的取消注释并填值。
      # 镜像已内置 linux nats CLI（/usr/local/bin/nats，pin sha256）。
      # NATS_SERVERS: "nats://your.server:4222"
      # NATS_CA_FILE: "system"
      TZ: "Asia/Shanghai"
    # /health 是 T-024 鉴权豁免端点，healthcheck 无需 token。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8462/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
